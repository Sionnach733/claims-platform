spring:
  application:
    name: claims-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/claims}
    username: ${DB_USERNAME:claims}
    password: ${DB_PASSWORD:claims}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, never by Hibernate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100   # cap ?size= so one request can't pull the whole table
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness and /readiness for ECS/k8s

app:
  fraud-service:
    base-url: ${FRAUD_SERVICE_URL:http://localhost:8000}
    connect-timeout: 500ms
    read-timeout: 1500ms
    review-threshold: 50          # score >= this (MEDIUM-high and HIGH) routes the claim to manual review
    retry:
      max-attempts: 2             # 1 retry: absorbs a blip without doubling worst-case latency much
      backoff: 100ms
    circuit-breaker:
      failure-rate-threshold: 50  # % of failed calls in the window that opens the circuit
      sliding-window-size: 10
      minimum-number-of-calls: 5
      wait-duration-in-open-state: 10s
      permitted-calls-in-half-open-state: 2
  adjudication:
    in-network-rate: 0.80
    out-of-network-rate: 0.50
    manual-review-threshold: 5000.00
  events:
    publisher-enabled: ${EVENTS_PUBLISHER_ENABLED:true}
    queue-name: ${CLAIM_EVENTS_QUEUE_NAME:claim-status-events}
    batch-size: 10            # SQS max per batch; also bounds how long outbox row locks are held
    poll-interval: 2s
  aws:
    region: ${AWS_REGION:eu-west-1}
    endpoint: ${AWS_SQS_ENDPOINT:http://localhost:4566}   # LocalStack; set AWS_SQS_ENDPOINT= (empty) in real AWS
