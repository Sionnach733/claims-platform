spring:
  application:
    name: claims-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/claims}
    username: ${DB_USERNAME:claims}
    password: ${DB_PASSWORD:claims}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, never by Hibernate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100   # cap ?size= so one request can't pull the whole table
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "     # text logs: request ID on every line
  structured:
    json:
      customizer: com.example.claims.observability.PhiMaskingLogCustomizer   # applies to JSON (ECS) logs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness and /readiness for ECS/k8s

app:
  fraud-service:
    base-url: ${FRAUD_SERVICE_URL:http://localhost:8000}
    connect-timeout: 500ms
    read-timeout: 1500ms
    review-threshold: 50          # score >= this (MEDIUM-high and HIGH) routes the claim to manual review
    retry:
      max-attempts: 2             # 1 retry: absorbs a blip without doubling worst-case latency much
      backoff: 100ms
    circuit-breaker:
      failure-rate-threshold: 50  # % of failed calls in the window that opens the circuit
      sliding-window-size: 10
      minimum-number-of-calls: 5
      wait-duration-in-open-state: 10s
      permitted-calls-in-half-open-state: 2
    api-key: ${FRAUD_API_KEY:local-dev-fraud-key}
  adjudication:
    in-network-rate: 0.80
    out-of-network-rate: 0.50
    manual-review-threshold: 5000.00
  events:
    publisher-enabled: ${EVENTS_PUBLISHER_ENABLED:true}
    queue-name: ${CLAIM_EVENTS_QUEUE_NAME:claim-status-events}
    batch-size: 10            # SQS max per batch; also bounds how long outbox row locks are held
    poll-interval: 2s
  security:
    jwt:
      secret: ${JWT_SECRET:local-dev-only-hmac-secret-change-me-0123456789}   # >= 32 bytes
      issuer: claims-service
      ttl: 1h
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}   # empty: UI is same-origin via proxy
    users:   # demo only: real deployments use an identity provider
      - username: submitter
        password: ${DEMO_SUBMITTER_PASSWORD:submitter-pass}
        roles: [SUBMITTER]
      - username: adjudicator
        password: ${DEMO_ADJUDICATOR_PASSWORD:adjudicator-pass}
        roles: [ADJUDICATOR]
  aws:
    region: ${AWS_REGION:eu-west-1}
    endpoint: ${AWS_SQS_ENDPOINT:http://localhost:4566}   # LocalStack; set AWS_SQS_ENDPOINT= (empty) in real AWS
