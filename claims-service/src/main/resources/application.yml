spring:
  application:
    name: claims-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/claims}
    username: ${DB_USERNAME:claims}
    password: ${DB_PASSWORD:claims}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, never by Hibernate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness and /readiness for ECS/k8s

app:
  fraud-service:
    base-url: ${FRAUD_SERVICE_URL:http://localhost:8000}
  events:
    queue-url: ${CLAIM_EVENTS_QUEUE_URL:http://localhost:4566/000000000000/claim-status-events}
