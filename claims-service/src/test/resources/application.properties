# Test overrides (merged on top of src/main/resources/application.yml)
app.events.poll-interval=200ms

# Shared Spring context across integration tests: keep the breaker from opening because one test
# deliberately simulates a fraud-service outage. Breaker behaviour is unit-tested in HttpFraudClientTest.
app.fraud-service.circuit-breaker.minimum-number-of-calls=1000
app.fraud-service.circuit-breaker.sliding-window-size=1000
app.fraud-service.retry.backoff=10ms
