# The whole Claims Platform showcase on one machine:
#
#   docker compose up --build -d --wait     # everything, healthy        → UI http://localhost:3000
#   docker compose up -d postgres mongo localstack   # infra only, for running services from your IDE
#
# Postgres stands in for Aurora PostgreSQL, LocalStack for SQS, Mongo for DocumentDB/Atlas.
# Secrets below are local-dev defaults; override them with a .env file (see .env.example; never commit
# real values). Infrastructure ports bind to 127.0.0.1 so the unauthenticated/default-credential
# databases aren't reachable from other machines on your network.
name: claims-platform

services:
  # ---------------------------------------------------------------- infrastructure
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claims
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claims}
    ports:
      - "127.0.0.1:5433:5432"   # 5433 on the host: avoids clashing with a locally installed Postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims -d claims"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: eu-west-1
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./infra/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name claim-status-events >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------- applications
  fraud-service:
    build: ./fraud-service
    image: claims-platform/fraud-service:local
    environment:
      FRAUD_MONGO_URI: mongodb://mongo:27017
      FRAUD_API_KEY: ${FRAUD_API_KEY:-local-dev-fraud-key}
      FRAUD_MEMBER_HASH_KEY: ${FRAUD_MEMBER_HASH_KEY:-local-dev-only-not-a-secret}
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy

  claims-service:
    build: ./claims-service
    image: claims-platform/claims-service:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/claims
      DB_USERNAME: claims
      DB_PASSWORD: ${POSTGRES_PASSWORD:-claims}
      FRAUD_SERVICE_URL: http://fraud-service:8000
      FRAUD_API_KEY: ${FRAUD_API_KEY:-local-dev-fraud-key}
      AWS_SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: eu-west-1
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-hmac-secret-change-me-0123456789}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      fraud-service:
        condition: service_healthy

  claims-ui:
    build: ./claims-ui
    image: claims-platform/claims-ui:local
    environment:
      CLAIMS_API_URL: http://claims-service:8080
    ports:
      - "3000:8080"
    depends_on:
      claims-service:
        condition: service_healthy

volumes:
  postgres-data:
  mongo-data:
